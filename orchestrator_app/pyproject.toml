[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-app"
version = "0.1.0"
description = "Agent orchestration app for the Watchtower POC."
requires-python = ">=3.11"
dependencies = [
    "cryptography==43.0.3",
    "fastapi==0.115.0",
    "Jinja2==3.1.4",
    "langgraph==0.2.61",
    "pydantic==2.9.2",
    "PyMySQL==1.1.1",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.36",
    "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = [".", "../bilvantis_watchtower/src"]
